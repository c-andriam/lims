services:
  senaite:
    image: docker.io/senaite/senaite:v2.6.0
    container_name: senaite
    restart: unless-stopped
    ports:
      # Port publie sur l'hote, configurable: cette machine heberge
      # d'autres applications qui peuvent revendiquer le meme port.
      # Surcharge via .env (SENAITE_PORT=8081) ou make up PORT=8081.
      - "${SENAITE_PORT:-8080}:8080"
    volumes:
      - senaite-data:/data
      - ./addons/senaite.trimeta.samplefields:/home/senaite/senaitelims/src/senaite.trimeta.samplefields
      - ./custom.cfg:/home/senaite/senaitelims/custom.cfg
    environment:
      # Python 2 ecrit ses .pyc A COTE des sources, pas dans un
      # __pycache__. Le container en produirait donc dans le repertoire
      # addons/ monte depuis l'hote, a chaque import, sous SON identite
      # -- et git ne pourrait plus toucher ces fichiers.
      # C'est la cause reelle des "Permission denied" au git pull.
      - PYTHONDONTWRITEBYTECODE=1
      - SITE=senaite
      - PASSWORD=bebex
      - TZ=Indian/Antananarivo
volumes:
  senaite-data:
